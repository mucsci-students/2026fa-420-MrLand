[project]
name = "2026fa-420-mrland"
version = "0.1.0"
description = "CLI interface for generating and viewing class schedules"
requires-python = ">=3.12"
dependencies = [
    "course-constraint-scheduler",
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
